name: CI

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'feat/**'
      - 'security/**'
  pull_request:
    branches:
      - main
      - master

# Principle of least privilege: token has read-only access to repository contents
permissions:
  contents: read

# Cancel in-progress runs for the same workflow/branch to conserve resources and avoid race conditions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test, Typecheck & Production Build
    runs-on: ubuntu-latest

    # Baseline environment: strictly sanitized secrets and database config
    env:
      NODE_ENV: test
      DATABASE_URL: "file:./prisma/ci.db?connection_limit=1"
      JWT_SECRET: "ci-test-jwt-secret-minimum-32-characters-espressivo-art"
      MOCK_PAYMENT_SECRET: "ci-test-mock-payment-secret-minimum-32-characters"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies via package-lock
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Push Prisma SQLite Schema
        run: npx prisma db push --skip-generate

      - name: Configure SQLite WAL & Busy Timeout
        run: node -e "const { PrismaClient } = require('@prisma/client'); const p = new PrismaClient(); p.\$queryRawUnsafe('PRAGMA journal_mode = WAL; PRAGMA busy_timeout = 15000;').then(() => p.\$disconnect());"

      - name: Seed Test Database
        run: node prisma/seed.js

      - name: Run ESLint
        run: npm run lint

      - name: Strict TypeScript Check
        run: npx tsc --noEmit

      - name: Run Vitest Test Suite
        run: npm test
        env:
          NODE_ENV: test
          ENABLE_MOCK_CHECKOUT: "true"

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          ENABLE_DEMO_ACCOUNTS: "false"
          ENABLE_MOCK_CHECKOUT: "false"
          ALLOW_PROD_SEED: "false"
